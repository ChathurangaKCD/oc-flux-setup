# GitRepository for openchoreo getting-started samples
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: openchoreo
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/openchoreo/openchoreo
  ref:
    tag: v1.0.0
  # Whitelist pattern (gitignore semantics): exclude everything, then walk down
  # the tree re-including parent dirs and re-excluding unwanted siblings at each
  # level. This is required because !/samples/getting-started/ on its own would
  # recursively re-include EVERYTHING under getting-started, which causes
  # kustomize build to fail with "may not add resource with an already
  # registered id" (the per-resource files in ci-workflows/ etc. are already
  # merged into all.yaml).
  ignore: |
    /*
    !/samples
    /samples/*
    !/samples/getting-started
    /samples/getting-started/*
    !/samples/getting-started/all.yaml
    !/samples/getting-started/workflow-templates.yaml
    !/samples/getting-started/workflow-templates
    # workflow-templates/ has BOTH the merged builds (which are also in
    # workflow-templates.yaml) and the k3d-specific helper templates the
    # README tells you to apply individually (checkout-source,
    # publish-image-k3d, generate-workload-k3d). Re-exclude the merged
    # build files so we don't conflict with workflow-templates.yaml.
    /samples/getting-started/workflow-templates/*
    !/samples/getting-started/workflow-templates/checkout-source.yaml
    !/samples/getting-started/workflow-templates/publish-image-k3d.yaml
    !/samples/getting-started/workflow-templates/generate-workload-k3d.yaml
