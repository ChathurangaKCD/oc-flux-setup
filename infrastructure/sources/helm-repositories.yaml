# GitRepository for openchoreo getting-started samples
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: openchoreo
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/openchoreo/openchoreo
  ref:
    tag: v1.0.0-rc.1
  ignore: |
    # exclude everything
    /*
    # include samples/getting-started/ selectively to avoid duplicates
    !/samples/
    !/samples/getting-started/
    # all.yaml has core OpenChoreo CRs (Project, Environment, ComponentType, etc.)
    !/samples/getting-started/all.yaml
    # Argo ClusterWorkflowTemplates
    !/samples/getting-started/workflow-templates.yaml
    !/samples/getting-started/workflow-templates/
    !/samples/getting-started/workflow-templates/**
