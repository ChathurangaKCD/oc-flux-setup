---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway
  namespace: openchoreo-control-plane
spec:
  interval: 30m
  dependsOn:
    - name: kgateway-crds
      namespace: openchoreo-control-plane
  chart:
    spec:
      chart: kgateway
      version: "v2.2.1"
      sourceRef:
        kind: HelmRepository
        name: kgateway
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    controller:
      extraEnv:
        KGW_ENABLE_GATEWAY_API_EXPERIMENTAL_FEATURES: "true"
