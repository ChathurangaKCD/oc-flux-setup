---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openbao
  namespace: openbao
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: openbao
      version: "0.25.6"
      sourceRef:
        kind: HelmRepository
        name: openbao
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    server:
      image:
        tag: "2.4.4"
      dev:
        enabled: true
        devRootToken: root
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 128Mi
          cpu: 100m
    injector:
      enabled: false
