---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kgateway-crds
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      chart: kgateway-crds
      version: "v2.1.1"
      sourceRef:
        kind: HelmRepository
        name: kgateway
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
