---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openbao-init
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/openbao-init
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure  # wait for ESO CRDs and OpenBao to be ready
