---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openchoreo-getting-started
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/openchoreo-getting-started
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Wait for plane CRs to be registered before creating projects/environments
  # Getting-started resources reference DataPlane 'default' via Environment CRs
  dependsOn:
    - name: openchoreo-plane-crs
