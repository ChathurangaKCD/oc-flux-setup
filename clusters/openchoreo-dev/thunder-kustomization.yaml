---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: thunder
  namespace: flux-system
spec:
  interval: 30m
  path: ./apps/thunder
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure  # wait for cert-manager, kgateway, etc.
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: thunder
      namespace: thunder
