# Helm values for OpenChoreo Control Plane in k3d single-cluster setup

openchoreoApi:
  http:
    hostnames:
    - api.openchoreovm.test
  config:
    server:
      publicUrl: "http://api.openchoreovm.test:8080"

backstage:
  baseUrl: "http://openchoreovm.test:8080"
  http:
    hostnames:
    - openchoreovm.test

security:
  oidc:
    issuer: "http://thunder.openchoreovm.test:8080"
    jwksUrl: "http://thunder.openchoreo-control-plane.svc.cluster.local:8090/oauth2/jwks"
    authorizationUrl: "http://thunder.openchoreovm.test:8080/oauth2/authorize"
    tokenUrl: "http://thunder.openchoreo-control-plane.svc.cluster.local:8090/oauth2/token"

thunder:
  fullnameOverride: thunder
  http:
    hostnames:
    - thunder.openchoreovm.test
  configuration:
    server:
      publicUrl: "http://thunder.openchoreovm.test:8080"
    gateClient:
      hostname: "thunder.openchoreovm.test"

gateway:
  tls:
    hostname: "*.openchoreovm.test"
  # Envoy configuration for traffic routing
  envoy:
    # Mount /tmp as emptyDir volume to fix Envoy temporary file creation issues
    # Enable this if gateway pods crash with "Failed to create temporary file" errors
    # Common on: macOS with Docker Desktop/Colima with Rosetta enabled.
    # Ref: https://github.com/kgateway-dev/kgateway/issues/9800
    mountTmpVolume: true
