# Helm values for OpenChoreo Control Plane in k3d single-cluster setup

openchoreoApi:
  http:
    hostnames:
    - api.openchoreovm.test
  config:
    server:
      publicUrl: "http://api.openchoreovm.test:8080"
    remoteConnect:
      # `occ remote` tunnels. Router NodePort 30443 is mapped to the host in config.yaml.
      enabled: true
      entrypointAddress: "127.0.0.1:30443"
      agentImage:
        tag: latest-dev

backstage:
  secretName: backstage-secrets
  baseUrl: "http://openchoreovm.test:8080"
  http:
    hostnames:
    - openchoreovm.test

portalAssistant:
  config:
    observerApiUrl: "http://observer.openchoreovm.test:11080"

security:
  oidc:
    issuer: "http://thunder.openchoreovm.test:8080"
    jwksUrl: "http://thunder.openchoreovm.test:8080/oauth2/jwks"
    authorizationUrl: "http://thunder.openchoreovm.test:8080/oauth2/authorize"
    tokenUrl: "http://thunder.openchoreovm.test:8080/oauth2/token"

gateway:
  httpPort: 8080
  httpsPort: 8443
  tls:
    enabled: false

features:
  secretManagement:
    enabled: true
