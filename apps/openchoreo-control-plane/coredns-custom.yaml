---
# CoreDNS custom config for k3d cluster
# Rewrites all *.openchoreovm.test hostnames to host.k3d.internal
# so pods can reach services exposed via k3d load balancer
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  openchoreo.override: |
    rewrite stop {
      name regex (.+\.)?openchoreovm\.test host.k3d.internal
      answer auto
    }
