---
# Backstage secrets required by the control plane
# For dev setup, these are static known values
apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: openchoreo-control-plane
type: Opaque
stringData:
  backend-secret: "local-dev-backend-secret"
  client-secret: "backstage-portal-secret"
  jenkins-api-key: "placeholder-not-in-use"
