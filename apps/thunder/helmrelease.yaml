---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: thunder
  namespace: thunder
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: thunder
      version: "0.28.0"
      sourceRef:
        kind: HelmRepository
        name: asgardeo
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: thunder-values
      valuesKey: values.yaml
