---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - argo-crds-helmrelease.yaml
  - registry-helmrelease.yaml
  - helmrelease.yaml
configMapGenerator:
  - name: openchoreo-workflow-plane-values
    namespace: openchoreo-workflow-plane
    files:
      - values.yaml
  - name: registry-values
    namespace: openchoreo-workflow-plane
    files:
      - values-registry.yaml
generatorOptions:
  disableNameSuffixHash: true
