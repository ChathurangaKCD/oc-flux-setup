---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openchoreo-workflow-plane
  namespace: openchoreo-workflow-plane
spec:
  interval: 5m
  timeout: 15m
  dependsOn:
    - name: openchoreo-control-plane
      namespace: openchoreo-control-plane
    - name: registry
      namespace: openchoreo-workflow-plane
    - name: argo-workflows-crds
      namespace: openchoreo-workflow-plane
  chart:
    spec:
      chart: openchoreo-workflow-plane
      version: "1.2.4"
      sourceRef:
        kind: HelmRepository
        name: openchoreo
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: openchoreo-workflow-plane-values
      valuesKey: values.yaml
