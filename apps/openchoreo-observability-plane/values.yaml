# Helm values for OpenChoreo Observability Plane in k3d single-cluster setup

finOpsAgent:
  http:
    hostnames:
    - finops-agent.openchoreovm.test

# Observer API - REST API for querying logs and metrics
observer:
  openSearchSecretName: opensearch-admin-credentials
  secretName: observer-secret
  http:
    hostnames:
    - observer.openchoreovm.test

security:
  oidc:
    jwksUrl: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/jwks"
    tokenUrl: "http://thunder-service.thunder.svc.cluster.local:8090/oauth2/token"
    authServerBaseUrl: "http://thunder.openchoreovm.test:8080"

rca:
  http:
    hostnames:
    - rca-agent.openchoreovm.test

gateway:
  httpPort: 11080
  httpsPort: 11085
  tls:
    enabled: false
