---
# ExternalSecrets for observability plane
# These pull secrets from the ClusterSecretStore (OpenBao) for OpenSearch and Observer
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-admin-credentials
  namespace: openchoreo-observability-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: opensearch-admin-credentials
  data:
    - secretKey: username
      remoteRef:
        key: opensearch-username
        property: value
    - secretKey: password
      remoteRef:
        key: opensearch-password
        property: value
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: observer-secret
  namespace: openchoreo-observability-plane
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: default
  target:
    name: observer-secret
  data:
    - secretKey: OPENSEARCH_USERNAME
      remoteRef:
        key: opensearch-username
        property: value
    - secretKey: OPENSEARCH_PASSWORD
      remoteRef:
        key: opensearch-password
        property: value
    - secretKey: UID_RESOLVER_OAUTH_CLIENT_SECRET
      remoteRef:
        key: observer-oauth-client-secret
        property: value
