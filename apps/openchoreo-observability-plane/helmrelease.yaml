---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openchoreo-observability-plane
  namespace: openchoreo-observability-plane
spec:
  interval: 30m
  timeout: 15m
  dependsOn:
    - name: openchoreo-control-plane
      namespace: openchoreo-control-plane
  chart:
    spec:
      chart: openchoreo-observability-plane
      version: "1.0.1"
      sourceRef:
        kind: HelmRepository
        name: openchoreo
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: ConfigMap
      name: openchoreo-observability-plane-values
      valuesKey: values.yaml
  # Note: fluent-bit is no longer a top-level chart value in v1.0.0+.
  # Logs/metrics/tracing modules are installed separately via observability modules
  # (see https://openchoreo.dev/modules).
