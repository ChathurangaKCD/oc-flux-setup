# Helm values for OpenChoreo Data Plane
# Adapted from upstream install/k3d/single-cluster/values-dp.yaml for openchoreovm.test

# Gateway configuration for single-cluster setup
gateway:
  httpPort: 19080
  httpsPort: 19443
  tls:
    enabled: false

fluent-bit:
  # Skip Secret-based envFrom for local dev, inject env vars directly
  envFrom: []
  env:
    - name: OPENSEARCH_HOST
      value: opensearch
    - name: OPENSEARCH_USER
      value: admin
    - name: OPENSEARCH_PASSWORD
      value: ThisIsTheOpenSearchPassword1
