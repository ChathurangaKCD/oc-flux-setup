# Helm values for OpenChoreo Data Plane in k3d single-cluster setup

# Gateway configuration for single-cluster setup
gateway:
  httpPort: 9080
  httpsPort: 9443
  # Use self-signed issuer in control plane for TLS certs
  selfSignedIssuer:
    enabled: false
  envoy:
    # Mount /tmp as emptyDir to fix Envoy temp file issues on macOS Docker/Colima
    # Ref: https://github.com/kgateway-dev/kgateway/issues/9800
    mountTmpVolume: true

# Reuse the existing control plane's cluster gateway controller
gatewayController:
  enabled: false

# External Secrets Operator configuration
external-secrets:
  enabled: true

# Enable Fluent Bit for log collection (DaemonSet collects logs from all namespaces)
fluent-bit:
  enabled: true
  config:
    outputs: |
      [OUTPUT]
          Name opensearch
          Host opensearch.openchoreo-observability-plane.svc.cluster.local
          Generate_ID On
          HTTP_Passwd ThisIsTheOpenSearchPassword1
          HTTP_User admin
          Logstash_Format On
          Logstash_DateFormat %Y-%m-%d
          Logstash_Prefix container-logs
          Match kube.*
          Port 9200
          Suppress_Type_Name On
          tls On
          tls.verify Off
